<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0D0E11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Worship Tools Remote</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0d0e11;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    header {
      background: #12141a;
      border-bottom: 1px solid #232731;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #fff;
    }
    .brand span {
      color: #0099ff;
    }
    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
    }
    .status-badge.online {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
    }
    .status-badge.offline {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }
    .main-content {
      flex: 1;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }
    .now-playing-card {
      background: #16181e;
      border: 1px solid #272a33;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .song-title {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .badges-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .meta-badge {
      background: #0d0e11;
      border: 1px solid #2e323b;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
    }
    .progress-bar-container {
      width: 100%;
      height: 28px;
      display: flex;
      align-items: center;
      cursor: pointer;
      position: relative;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: #232731;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0099ff, #38bdf8);
      width: 0%;
      transition: width 0.1s linear;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-family: monospace;
      color: #94a3b8;
      margin-top: -4px;
    }
    /* TRANSPORT CONTROLS */
    .transport-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr 1fr;
      gap: 10px;
    }
    .btn-touch {
      background: #16181e;
      border: 1px solid #2e323b;
      color: #fff;
      border-radius: 12px;
      padding: 16px 8px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.12s ease;
    }
    .btn-touch:active {
      transform: scale(0.96);
      filter: brightness(1.2);
    }
    .btn-play-pause {
      background: linear-gradient(135deg, #0099ff, #0284c7);
      border: 2px solid #38bdf8;
      box-shadow: 0 0 20px rgba(0, 153, 255, 0.4);
    }
    .btn-play-pause.playing {
      background: linear-gradient(135deg, #10b981, #059669);
      border-color: #34d399;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
    }
    .btn-touch svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }
    .secondary-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-sec {
      background: #14161c;
      border: 1px solid #282c37;
      color: #cbd5e1;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-sec.active {
      background: rgba(0, 153, 255, 0.2);
      border-color: #0099ff;
      color: #38bdf8;
    }
    /* SECTIONS GRID */
    .section-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .section-title-row strong {
      font-size: 13px;
      color: #cbd5e1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .section-title-row span {
      font-size: 11px;
      color: #94a3b8;
    }
    .sections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 8px;
    }
    .section-pill {
      background: #16181e;
      border: 1px solid #272a33;
      border-radius: 8px;
      padding: 12px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }
    .section-pill:active {
      transform: scale(0.95);
    }
    .section-pill .sec-name {
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      color: #fff;
    }
    .section-pill .sec-time {
      font-size: 10px;
      color: #94a3b8;
      font-family: monospace;
    }
    .section-pill.active {
      border: 2px solid #0099ff !important;
      box-shadow: 0 0 16px rgba(0, 153, 255, 0.6);
      background: rgba(0, 153, 255, 0.15);
      animation: pulse 1.8s infinite;
    }
    .section-pill.queued {
      border: 2px dashed #f59e0b !important;
      background: rgba(245, 158, 11, 0.15);
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 14px rgba(0, 153, 255, 0.6); }
      50% { box-shadow: 0 0 24px rgba(0, 153, 255, 0.9); }
    }
    /* MIXER DRAWER */
    .mixer-box {
      background: #14161c;
      border: 1px solid #272a33;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .mixer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mixer-channels-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .mixer-row {
      display: grid;
      grid-template-columns: 80px 1fr 40px 40px;
      gap: 8px;
      align-items: center;
      background: #0d0e11;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #222630;
    }
    .ch-label {
      font-size: 11px;
      font-weight: 800;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ch-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: #232731;
      border-radius: 3px;
      outline: none;
    }
    .ch-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #0099ff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0, 153, 255, 0.6);
    }
    .btn-m, .btn-s {
      border: 1px solid #333846;
      background: #16181e;
      color: #94a3b8;
      border-radius: 6px;
      height: 30px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-m.active {
      background: #ef4444;
      border-color: #ef4444;
      color: #fff;
    }
    .btn-s.active {
      background: #f59e0b;
      border-color: #f59e0b;
      color: #000;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="/worship-tools-logo.jpg" alt="Logo" style="width: 24px; height: 24px; border-radius: 5px; object-fit: contain; vertical-align: middle; border: 1px solid rgba(255,255,255,0.15);" onerror="this.style.display='none'">
      <span>WORSHIP</span> TOOLS
    </div>
    <div id="conn-status" class="status-badge offline">
      <span>●</span> Desconectado
    </div>
  </header>

  <div class="main-content">
    <!-- NOW PLAYING CARD -->
    <div class="now-playing-card">
      <div>
        <div id="song-title" class="song-title">Aguardando Playback...</div>
        <div id="song-artist" class="song-artist">Abra uma música no app principal</div>
      </div>

      <div class="badges-row">
        <span id="badge-key" class="meta-badge">Tom: -</span>
        <span id="badge-bpm" class="meta-badge">BPM: -</span>
        <span id="badge-time" class="meta-badge">4/4</span>
      </div>

      <div class="progress-bar-container" id="progress-bar">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
      <div class="time-row">
        <span id="cur-time">0:00</span>
        <span id="total-time">0:00</span>
      </div>
    </div>

    <!-- TRANSPORT CONTROLS -->
    <div class="transport-grid">
      <button class="btn-touch" id="btn-prev">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        <span>Anterior</span>
      </button>

      <button class="btn-touch btn-play-pause" id="btn-play">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span id="play-label">Play</span>
      </button>

      <button class="btn-touch" id="btn-stop">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
        <span>Stop</span>
      </button>
    </div>

    <div class="secondary-controls" style="grid-template-columns: 1fr 1fr 1fr;">
      <button class="btn-sec" id="btn-click" title="Click Autônomo: Mantém metrônomo contínuo mesmo com VS parado">
        <span>⏱️</span> Click
      </button>
      <button class="btn-sec" id="btn-fade">
        <span>🌫️</span> Fade Stems
      </button>
      <button class="btn-sec" id="btn-loop">
        <span>🔁</span> Loop Seção
      </button>
    </div>

    <!-- LIVE SECTIONS MAP -->
    <div>
      <div class="section-title-row">
        <strong>🗺️ Mapa da Música (Live ReOrder)</strong>
        <span>1x Pular Compassso · 2x Pular Já</span>
      </div>
      <div class="sections-grid" id="sections-container" style="margin-top: 8px;">
        <div style="font-size: 11px; color: #64748b; padding: 12px; grid-column: 1 / -1; text-align: center;">
          Nenhuma seção carregada no momento
        </div>
      </div>
    </div>

    <!-- QUICK MIXER -->
    <div class="mixer-box">
      <div class="mixer-header">
        <strong id="mixer-heading" style="font-size: 12.5px; color: #38bdf8;">🎛️ Mixer de Tracks (Stems Individuais)</strong>
        <div style="display: flex; gap: 6px;">
          <button id="tab-tracks" class="btn-sec active" style="padding: 4px 8px; font-size: 10.5px; border-radius: 6px;" onclick="setMixerMode('tracks')">Tracks</button>
          <button id="tab-buses" class="btn-sec" style="padding: 4px 8px; font-size: 10.5px; border-radius: 6px;" onclick="setMixerMode('buses')">Grupos</button>
        </div>
      </div>
      <div class="mixer-channels-list" id="mixer-list">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let currentState = null;
    let lastTap = 0;

    const statusEl = document.getElementById('conn-status');
    const songTitleEl = document.getElementById('song-title');
    const songArtistEl = document.getElementById('song-artist');
    const badgeKeyEl = document.getElementById('badge-key');
    const badgeBpmEl = document.getElementById('badge-bpm');
    const progressFillEl = document.getElementById('progress-fill');
    const curTimeEl = document.getElementById('cur-time');
    const totalTimeEl = document.getElementById('total-time');
    const btnPlay = document.getElementById('btn-play');
    const playIcon = document.getElementById('play-icon');
    const playLabel = document.getElementById('play-label');
    const btnStop = document.getElementById('btn-stop');
    const btnPrev = document.getElementById('btn-prev');
    const btnFade = document.getElementById('btn-fade');
    const btnLoop = document.getElementById('btn-loop');
    const btnClick = document.getElementById('btn-click');
    const sectionsContainer = document.getElementById('sections-container');
    const mixerList = document.getElementById('mixer-list');

    function formatTime(s) {
      if (!isFinite(s) || s < 0) return '0:00';
      const m = Math.floor(s / 60);
      const rem = Math.floor(s % 60);
      return `${m}:${rem.toString().padStart(2, '0')}`;
    }

    function sendAction(action, payload = {}) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action, ...payload }));
      }
    }

    function connectWs() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${proto}//${location.host}/ws`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusEl.className = 'status-badge online';
        statusEl.innerHTML = '<span>●</span> Conectado';
      };

      ws.onclose = () => {
        statusEl.className = 'status-badge offline';
        statusEl.innerHTML = '<span>●</span> Reconectando...';
        setTimeout(connectWs, 2000);
      };

      ws.onerror = () => {
        ws.close();
      };

      ws.onmessage = (ev) => {
        try {
          const data = JSON.parse(ev.data);
          handleServerMessage(data);
        } catch (e) {
          console.warn('Erro ao processar mensagem WS:', e);
        }
      };
    }

    function handleServerMessage(data) {
      currentState = data;

      // Update Play state
      if (data.playing) {
        btnPlay.classList.add('playing');
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        playLabel.textContent = 'Pause';
      } else {
        btnPlay.classList.remove('playing');
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        playLabel.textContent = 'Play';
      }

      // Update Autonomous Click state
      if (btnClick) {
        if (data.autonomousClick) {
          btnClick.classList.add('active');
          btnClick.style.borderColor = '#f59e0b';
          btnClick.style.color = '#fbbf24';
        } else {
          btnClick.classList.remove('active');
          btnClick.style.borderColor = '';
          btnClick.style.color = '';
        }
      }

      // Update Song Info
      if (data.song) {
        songTitleEl.textContent = data.song.title || 'Música Sem Nome';
        songArtistEl.textContent = data.song.artist || 'Artista';
        badgeKeyEl.textContent = `Tom: ${data.song.key || 'C'}`;
        badgeBpmEl.textContent = `${Math.round(data.song.bpm || 120)} BPM`;
      } else {
        songTitleEl.textContent = 'Nenhuma música carregada';
        songArtistEl.textContent = 'Selecione uma música no app principal';
        badgeKeyEl.textContent = 'Tom: -';
        badgeBpmEl.textContent = 'BPM: -';
      }

      // Update Progress
      const cur = data.position || 0;
      const dur = data.duration || (data.song ? data.song.duration : 0) || 1;
      const pct = Math.min(100, Math.max(0, (cur / dur) * 100));
      progressFillEl.style.width = `${pct}%`;
      curTimeEl.textContent = formatTime(cur);
      totalTimeEl.textContent = formatTime(dur);

      // Render Sections
      renderSections(data.song?.sections || [], cur, data.queuedSectionId);

      // Render Mixer
      renderMixer(data.buses || [], data.tracks || []);
    }

    function renderSections(sections, currentPos, queuedId) {
      if (!sections || sections.length === 0) {
        sectionsContainer.innerHTML = '<div style="font-size: 11px; color: #64748b; padding: 12px; grid-column: 1 / -1; text-align: center;">Nenhuma seção cadastrada</div>';
        return;
      }

      let activeSectionId = null;
      for (const s of sections) {
        if (currentPos >= s.start && currentPos < s.end) {
          activeSectionId = s.id;
          break;
        }
      }

      sectionsContainer.innerHTML = sections.map((s) => {
        const isActive = s.id === activeSectionId;
        const isQueued = s.id === queuedId;
        const borderStyle = s.color ? `border-top: 3px solid ${s.color};` : '';
        return `
          <div class="section-pill ${isActive ? 'active' : ''} ${isQueued ? 'queued' : ''}" 
               style="${borderStyle}" 
               onclick="handleSectionClick('${s.id}')">
            <span class="sec-name">${s.label}</span>
            <span class="sec-time">${formatTime(s.start)}</span>
          </div>
        `;
      }).join('');
    }

    function handleSectionClick(sectionId) {
      const now = Date.now();
      const DOUBLE_TAP_DELAY = 300;
      if (now - lastTap < DOUBLE_TAP_DELAY) {
        // Double tap: immediate jump
        sendAction('jump', { sectionId, mode: 'now' });
      } else {
        // Single tap: sync jump on bar boundary
        sendAction('jump', { sectionId, mode: 'bar' });
      }
      lastTap = now;
    }

    let mixerMode = 'tracks';

    function setMixerMode(mode) {
      mixerMode = mode;
      const tabTracks = document.getElementById('tab-tracks');
      const tabBuses = document.getElementById('tab-buses');
      const heading = document.getElementById('mixer-heading');
      if (tabTracks) tabTracks.classList.toggle('active', mode === 'tracks');
      if (tabBuses) tabBuses.classList.toggle('active', mode === 'buses');
      if (heading) {
        heading.textContent = mode === 'tracks'
          ? '🎛️ Mixer de Tracks (Stems Individuais)'
          : '🎛️ Mixer de Grupos (Buses Principais)';
      }
      if (currentState) {
        renderMixer(currentState.buses || [], currentState.tracks || []);
      }
    }

    function renderMixer(buses, tracks) {
      if (mixerMode === 'tracks' && tracks && tracks.length > 0) {
        mixerList.innerHTML = tracks.map((t) => `
          <div class="mixer-row" style="border-left: 3px solid ${t.color || '#0099ff'};">
            <div class="ch-label" title="${t.name}">
              <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:${t.color || '#0099ff'}; margin-right:4px;"></span>
              ${t.name}
            </div>
            <input type="range" class="ch-slider" min="0" max="1.2" step="0.01" value="${t.vol}" 
                   oninput="sendAction('track_volume', { trackId: '${t.id}', value: parseFloat(this.value) })" />
            <button class="btn-m ${t.mute ? 'active' : ''}" 
                    onclick="sendAction('track_mute', { trackId: '${t.id}' })">M</button>
            <button class="btn-s ${t.solo ? 'active' : ''}" 
                    onclick="sendAction('track_solo', { trackId: '${t.id}' })">S</button>
          </div>
        `).join('');
        return;
      }

      const defaultBuses = [
        { id: 'CLICK', name: '⏱️ CLICK', vol: 0.9, mute: false, solo: false },
        { id: 'GUIDE', name: '🗣️ GUIA', vol: 0.9, mute: false, solo: false },
        { id: 'DRUMS', name: '🥁 BATERIA', vol: 0.85, mute: false, solo: false },
        { id: 'BASS', name: '🎸 BAIXO', vol: 0.85, mute: false, solo: false },
        { id: 'GUITARS', name: '🎸 GUITARRAS', vol: 0.85, mute: false, solo: false },
        { id: 'KEYS', name: '🎹 TECLAS/PAD', vol: 0.85, mute: false, solo: false },
        { id: 'VOCALS', name: '🎤 VOCAIS', vol: 0.85, mute: false, solo: false },
      ];

      const list = buses && buses.length > 0 ? buses : defaultBuses;

      mixerList.innerHTML = list.map((b) => `
        <div class="mixer-row">
          <div class="ch-label">${b.name}</div>
          <input type="range" class="ch-slider" min="0" max="1" step="0.01" value="${b.vol}" 
                 oninput="sendAction('bus_volume', { bus: '${b.id}', value: parseFloat(this.value) })" />
          <button class="btn-m ${b.mute ? 'active' : ''}" 
                  onclick="sendAction('bus_mute', { bus: '${b.id}', value: ${!b.mute} })">M</button>
          <button class="btn-s ${b.solo ? 'active' : ''}" 
                  onclick="sendAction('bus_solo', { bus: '${b.id}', value: ${!b.solo} })">S</button>
        </div>
      `).join('');
    }

    // Transport Listeners
    btnPlay.onclick = () => {
      if (currentState && currentState.playing) {
        sendAction('pause');
      } else {
        sendAction('play');
      }
    };

    btnStop.onclick = () => sendAction('stop');
    btnPrev.onclick = () => sendAction('prev_song');
    btnFade.onclick = () => sendAction('fade_out');
    btnLoop.onclick = () => sendAction('loop_current');
    btnClick.onclick = () => sendAction('toggle_click');

    // Seek bar listener
    const progressBar = document.getElementById('progress-bar');
    progressBar.onclick = (e) => {
      if (!currentState || !currentState.duration) return;
      const rect = progressBar.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const targetPos = pct * currentState.duration;
      sendAction('seek', { position: targetPos });
    };

    // Connect automatically
    connectWs();
  </script>
</body>
</html>
