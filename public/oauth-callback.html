<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Autenticando - Worship Playback Pro</title>
  <style>
    body {
      background: #0d0e11;
      color: #eef1f7;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2e323b;
      border-top-color: #0099ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Autenticação Concluída</h2>
  <p style="color: #93a0b5; font-size: 14px;">Validando credenciais com o servidor...</p>
  <script>
    try {
      const hash = window.location.hash || window.location.search;
      if (window.opener) {
        window.opener.postMessage({ type: 'WPP_OAUTH_SUCCESS', payload: hash }, '*');
        setTimeout(() => window.close(), 600);
      }
    } catch (e) {
      console.error(e);
    }
  </script>
</body>
</html>
